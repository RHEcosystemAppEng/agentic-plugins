apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: agentic-plugins
  title: Agentic Plugins
  description: >
    Agent plugins and MCP server configurations for Red Hat platforms.
    Provides AI-powered automation across OpenShift, Ansible, Virtualization,
    AI/ML, and SRE workflows through persona-specific skill modules.
  tags:
    - ai-skill
    - agentic
    - red-hat
  annotations:
    agentic-plugins.redhat.com/version: "1.0"
    agentic-plugins.redhat.com/repo: "agentic-plugins"
    agentic.redhat.com/repository: https://github.com/RHEcosystemAppEng/agentic-plugins
    github.com/project-slug: RHEcosystemAppEng/agentic-plugins

spec:
  owner: group:redhat/ai5-marketplace
  dependencyOf:
    - airesource:ai5-marketplace/ocp-admin
    - airesource:ai5-marketplace/rh-sre
    - airesource:ai5-marketplace/rh-virt
    - airesource:ai5-marketplace/rh-basic
    - mcpserver:ai5-marketplace/ansible-automation-platform
    - mcpserver:ai5-marketplace/assisted-installer
    - mcpserver:ai5-marketplace/openshift-mcp-server
