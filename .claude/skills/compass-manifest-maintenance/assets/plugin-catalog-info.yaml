# Template: <plugin>/<plugin>-plugin.yaml
# Replace <plugin>, title, description, summary, tags, disciplines, categories, skills, includes, dependsOn (MCP union).
# New plugins: spec.lifecycle defaults to development (confirm with user before raising maturity).
# Membership: spec.includes (skills + owned MCP) AND legacy spec.skills (skill refs only).
# Canonical mcpserver:redhat/* stays on dependsOn only — never in includes.
# Do not copy .catalog maturity or contents.skills into Compass YAML.
# Keep metadata.labels.support_level in sync with .catalog support_level (developer-preview).
apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: <plugin>
  namespace: ai5-marketplace
  title: <Plugin Title>
  description: >
    <Plugin description from README or plugin manifest.>
  summary: >
    <Short catalog summary (distinct from description).>
  tags:
    - ai-skill
    - <plugin-tag>
  labels:
    distribution: external
    support_level: developer-preview
  annotations:
    agentic-plugins.redhat.com/version: "1.0"
    agentic-plugins.redhat.com/repo: "agentic-plugins"
    agentic.redhat.com/lola-module: "true"
    agentic.redhat.com/lola-module-name: <plugin>
    agentic.redhat.com/repository: https://github.com/RHEcosystemAppEng/agentic-plugins
    agentic.redhat.com/path: <plugin>
    github.com/project-slug: RHEcosystemAppEng/agentic-plugins
    # Destination targeting (Q7): set "true" only for destinations this pack is published to.
    # All four Compass-registered packs today use redhat-only, ecosystem, and oci (see closed Q7).
    publishing.redhat.com/redhat-only: "true"
    publishing.redhat.com/ecosystem: "true"
    publishing.redhat.com/oci: "true"
  links:
    - url: https://github.com/RHEcosystemAppEng/agentic-plugins/blob/main/LICENSE
      type: license_agreement
      title: License agreement
    - url: https://www.redhat.com/en/about/privacy-policy
      type: privacy_policy
      title: Privacy policy
    - url: https://github.com/RHEcosystemAppEng/agentic-plugins
      title: Source Repository
      icon: github
spec:
  type: plugin
  lifecycle: development
  owner: group:redhat/ai5-marketplace
  system: default/agentic-plugins
  version: "1.0"
  disciplines:
    - <discipline>
  categories:
    - <category>
  agents: []
  license: Apache-2.0
  attribution:
    provider: Red Hat
    author: Red Hat Ecosystem Engineering
  personas:
    - <primary persona>
  support:
    ownerEmail: eco-engineering@redhat.com
  sampleWorkflows:
    - name: <Example workflow>
      description: |
        User: "<user prompt>"
        - <skill-name> <expected behavior>
  skills:
    - airesource:ai5-marketplace/<skill-name>
    # Every skill in the plugin — same set as includes type:skill (legacy dual-write until H.4)
  includes:
    - entityRef: airesource:ai5-marketplace/<skill-name>
      type: skill
    # - entityRef: mcpserver:ai5-marketplace/<owned-mcp>
    #   type: mcp-server
    # Owned MCP only. Do not add mcpserver:redhat/* here. No gitRef.
  dependsOn:
    # Union of mcpserver refs used by any skill in this plugin (omit if none)
    # - mcpserver:ai5-marketplace/<owned-mcp>
    # - mcpserver:redhat/<canonical-mcp>
