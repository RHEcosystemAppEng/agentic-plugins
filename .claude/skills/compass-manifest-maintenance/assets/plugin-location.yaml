# Template: <plugin>/catalog-info.yaml (Location)
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: <plugin>
  title: <Plugin Title> Agent Plugin
  description: >
    Points to all AI skill catalog entities in the <plugin> agent plugin.
  annotations:
    agentic-plugins.redhat.com/version: "1.0"
    agentic-plugins.redhat.com/repo: "agentic-plugins"
    agentic.redhat.com/lola-module: "true"
    agentic.redhat.com/lola-module-name: <plugin>
    agentic.redhat.com/repository: https://github.com/RHEcosystemAppEng/agentic-plugins
    agentic.redhat.com/path: <plugin>
spec:
  targets:
    - ./<plugin>-plugin.yaml
    - ./skills/<skill-name>/catalog-info.yaml
    # List every skill manifest under skills/
