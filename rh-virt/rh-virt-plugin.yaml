apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: rh-virt
  namespace: ai5-marketplace
  title: Red Hat Virtualization
  description: >
    Automation capabilities for VM lifecycle management, provisioning,
    and inventory operations on OpenShift clusters using KubeVirt.
  summary: >
    The rh-virt collection ships 10 skills for OpenShift Virtualization operations
    with confirmations on destructive steps.
  tags:
    - ai-skill
    - virtualization
    - kubevirt
    - openshift
  labels:
    distribution: external
    support_level: developer-preview
  annotations:
    agentic-plugins.redhat.com/version: "1.0"
    agentic-plugins.redhat.com/repo: "agentic-plugins"
    agentic.redhat.com/lola-module: "true"
    agentic.redhat.com/lola-module-name: rh-virt
    agentic.redhat.com/repository: https://github.com/RHEcosystemAppEng/agentic-plugins
    agentic.redhat.com/path: rh-virt
    github.com/project-slug: RHEcosystemAppEng/agentic-plugins
    publishing.redhat.com/redhat-only: "true"
    publishing.redhat.com/ecosystem: "true"
    publishing.redhat.com/oci: "true"
  links:
    - url: https://github.com/RHEcosystemAppEng/agentic-plugins/blob/main/LICENSE
      type: license_agreement
      title: License agreement
    - url: https://www.redhat.com/en/about/privacy-policy
      type: privacy_policy
      title: Privacy policy
    - url: https://github.com/RHEcosystemAppEng/agentic-plugins
      title: Source Repository
      icon: github
spec:
  type: plugin
  lifecycle: beta
  owner: group:redhat/ai5-marketplace
  system: default/agentic-plugins
  version: "1.0"
  disciplines:
    - platform-engineering
  categories:
    - virtualization
    - vm-lifecycle
  agents: []
  license: Apache-2.0
  attribution:
    provider: Red Hat
    author: Red Hat Ecosystem Engineering
  personas:
    - Red Hat platform engineer
  support:
    ownerEmail: eco-engineering@redhat.com
  sampleWorkflows:
    - name: Create and verify VM
      description: |
        User: "Create a small RHEL VM in my team namespace"
        - `/vm-create` resolves instance type and OS and applies the VirtualMachine spec with approval
        - `/vm-inventory` confirms the VM is running with expected resources
    - name: Snapshot before change
      description: |
        User: "Snapshot database-vm before the maintenance window"
        - `/vm-snapshot-create` validates storage class and guest agent readiness
        - `/vm-lifecycle-manager` stops the VM if the restore path requires it later
    - name: Maintenance drain
      description: |
        User: "Drain worker-04 and move VMs safely"
        - `/vm-rebalance` plans migrations for load or node maintenance
        - `/vm-inventory` verifies placement after moves complete
  skills:
    - airesource:ai5-marketplace/vm-clone
    - airesource:ai5-marketplace/vm-create
    - airesource:ai5-marketplace/vm-delete
    - airesource:ai5-marketplace/vm-inventory
    - airesource:ai5-marketplace/vm-lifecycle-manager
    - airesource:ai5-marketplace/vm-rebalance
    - airesource:ai5-marketplace/vm-snapshot-create
    - airesource:ai5-marketplace/vm-snapshot-delete
    - airesource:ai5-marketplace/vm-snapshot-list
    - airesource:ai5-marketplace/vm-snapshot-restore
  includes:
    - entityRef: airesource:ai5-marketplace/vm-clone
      type: skill
    - entityRef: airesource:ai5-marketplace/vm-create
      type: skill
    - entityRef: airesource:ai5-marketplace/vm-delete
      type: skill
    - entityRef: airesource:ai5-marketplace/vm-inventory
      type: skill
    - entityRef: airesource:ai5-marketplace/vm-lifecycle-manager
      type: skill
    - entityRef: airesource:ai5-marketplace/vm-rebalance
      type: skill
    - entityRef: airesource:ai5-marketplace/vm-snapshot-create
      type: skill
    - entityRef: airesource:ai5-marketplace/vm-snapshot-delete
      type: skill
    - entityRef: airesource:ai5-marketplace/vm-snapshot-list
      type: skill
    - entityRef: airesource:ai5-marketplace/vm-snapshot-restore
      type: skill
    - entityRef: mcpserver:ai5-marketplace/openshift-mcp-server
      type: mcp-server
  dependsOn:
    - mcpserver:ai5-marketplace/openshift-mcp-server
