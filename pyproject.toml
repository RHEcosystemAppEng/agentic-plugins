[project]
name = "agentic-plugins"
version = "0.1.0"
description = "Agentic plugins for Red Hat platforms (skills, agents, MCP)"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.0",
    "markdown>=3.6",
]

[dependency-groups]
dev = [
    "codespell>=2.3.0",
    "pre-commit>=4.0.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F"]
